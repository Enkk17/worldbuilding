openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WORLDWEAVE M1 foundation API. PostgreSQL-backed, session-authenticated endpoints.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health and readiness operations
  - name: auth
    description: Account and revocable session operations
  - name: universes
    description: Universe and society operations
  - name: codex
    description: Codex entities, relationships, and nexus graph operations
  - name: chronicle
    description: Chronicle documents, revisions, comments, and cross-links
  - name: collaboration
    description: Short-lived credentials for realtime document collaboration
  - name: atlas
    description: Image maps, normalized markers, and polygon overlays
  - name: chronos
    description: Custom calendar systems, eras, and timeline events
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Confirms that the API process is running.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Confirms that required dependencies are ready.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register an account
      description: Creates an account when instance registration policy permits and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account created and authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid registration data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Open registration is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Log in
      description: Verifies credentials, rotates the session, and starts a new session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure, HttpOnly, SameSite session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Log out
      description: Revokes the current server-side session and clears its cookie.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked.
  /v1/auth/me:
    get:
      operationId: getCurrentAccount
      tags: [auth]
      summary: Get the current account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/universes:
    get:
      operationId: listUniverses
      tags: [universes]
      summary: List universes for current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of accessible universes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseListResponse"
    post:
      operationId: createUniverse
      tags: [universes]
      summary: Create a new universe
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniverseCreate"
      responses:
        "201":
          description: Universe created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseResponse"
  /v1/universes/{universe_id}:
    get:
      operationId: getUniverse
      tags: [universes]
      summary: Get universe details
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Universe details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseResponse"
        "404":
          description: Universe not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateUniverse
      tags: [universes]
      summary: Update universe settings
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniverseUpdate"
      responses:
        "200":
          description: Universe updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseResponse"
  /v1/universes/{universe_id}/archive:
    post:
      operationId: archiveUniverse
      tags: [universes]
      summary: Archive universe
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Universe archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseResponse"
  /v1/universes/{universe_id}/members:
    get:
      operationId: listUniverseMembers
      tags: [universes]
      summary: List members in universe
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberResponse"
  /v1/universes/{universe_id}/members/{user_id}:
    patch:
      operationId: updateMemberRole
      tags: [universes]
      summary: Update member role
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Member role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
    delete:
      operationId: removeMember
      tags: [universes]
      summary: Remove member from universe
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member removed.
  /v1/universes/{universe_id}/invitations:
    post:
      operationId: createInvitation
      tags: [universes]
      summary: Invite member to universe
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
  /v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [universes]
      summary: Accept invitation
      security:
        - sessionCookie: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseResponse"
  /v1/universes/{universe_id}/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [universes]
      summary: List audit logs
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit logs list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogResponse"
  /v1/universes/{universe_id}/activity:
    get:
      operationId: listActivity
      tags: [universes]
      summary: List activity events
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity events list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEventResponse"
  /v1/universes/{universe_id}/entity-types:
    get:
      operationId: listEntityTypes
      tags: [codex]
      summary: List entity types
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of entity types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityTypeResponse"
    post:
      operationId: createEntityType
      tags: [codex]
      summary: Create custom entity type
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityTypeCreate"
      responses:
        "201":
          description: Entity type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeResponse"
  /v1/universes/{universe_id}/entity-types/{type_id}:
    patch:
      operationId: updateEntityType
      tags: [codex]
      summary: Update entity type
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityTypeUpdate"
      responses:
        "200":
          description: Entity type updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeResponse"
  /v1/universes/{universe_id}/relation-types:
    get:
      operationId: listRelationTypes
      tags: [codex]
      summary: List relation types
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of relation types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationTypeResponse"
    post:
      operationId: createRelationType
      tags: [codex]
      summary: Create custom relation type
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationTypeCreate"
      responses:
        "201":
          description: Relation type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationTypeResponse"
  /v1/universes/{universe_id}/entities:
    get:
      operationId: listEntities
      tags: [codex]
      summary: List entities in universe
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityListResponse"
    post:
      operationId: createEntity
      tags: [codex]
      summary: Create new entity
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityCreate"
      responses:
        "201":
          description: Entity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
  /v1/universes/{universe_id}/entities/{entity_id}:
    get:
      operationId: getEntity
      tags: [codex]
      summary: Get entity details
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entity details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
    patch:
      operationId: updateEntity
      tags: [codex]
      summary: Update entity with optimistic concurrency
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpdate"
      responses:
        "200":
          description: Entity updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
        "409":
          description: Version conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteEntity
      tags: [codex]
      summary: Soft-delete entity
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Entity deleted.
  /v1/universes/{universe_id}/entities/{entity_id}/restore:
    post:
      operationId: restoreEntity
      tags: [codex]
      summary: Restore deleted entity
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entity restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
  /v1/universes/{universe_id}/entities/{entity_id}/relations:
    get:
      operationId: listEntityRelations
      tags: [codex]
      summary: List incoming and outgoing relations for entity
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of relations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityRelationResponse"
  /v1/universes/{universe_id}/relations:
    post:
      operationId: createEntityRelation
      tags: [codex]
      summary: Create directed relation between entities
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRelationCreate"
      responses:
        "201":
          description: Relation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityRelationResponse"
  /v1/universes/{universe_id}/relations/{relation_id}:
    delete:
      operationId: deleteEntityRelation
      tags: [codex]
      summary: Remove relation
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: relation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relation removed.
  /v1/universes/{universe_id}/graph:
    get:
      operationId: getNexusGraph
      tags: [codex]
      summary: Get knowledge graph nodes and edges
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: focus_entity_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 150
      responses:
        "200":
          description: Graph structure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
  /v1/universes/{universe_id}/documents:
    get:
      operationId: listDocuments
      tags: [chronicle]
      summary: List Chronicle documents
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: parent_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: root_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [collection, work, part, chapter, scene, note]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, review, published, archived]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: updated_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Accessible documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
    post:
      operationId: createDocument
      tags: [chronicle]
      summary: Create a Chronicle document
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreate"
      responses:
        "201":
          description: Document created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "403":
          description: Role cannot create documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Parent document not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Invalid hierarchy or content payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/universes/{universe_id}/documents/tree:
    get:
      operationId: getDocumentTree
      tags: [chronicle]
      summary: Get the accessible document hierarchy
      security:
        - sessionCookie: []
      parameters:
        - name: universe_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTreeResponse"
        "413":
          description: The accessible tree exceeds the supported size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/universes/{universe_id}/documents/{document_id}:
    get:
      operationId: getDocument
      tags: [chronicle]
      summary: Get a document with links, breadcrumbs, and permissions
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UniverseId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: Document not found or not visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateDocument
      tags: [chronicle]
      summary: Update a document with optimistic concurrency
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UniverseId"
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Document updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "403":
          description: Role cannot edit this document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Document not found or not visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Version conflict or invalid hierarchy state.
          content:
            application/json:
