kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && uv run --project . --locked alembic -c backend/alembic.ini upgrade head && exec uv run --project . --locked uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --no-access-log"

[services.production]

[services.production.build]
args = ["uv", "sync", "--locked", "--no-dev"]

[services.production.run]
args = ["sh", "-c", "cd ../.. && exec uv run --project . --no-sync uvicorn backend.main:app --host 0.0.0.0 --port 8080 --proxy-headers --no-access-log"]

[services.production.run.env]
PORT = "8080"
ENVIRONMENT = "production"

[services.production.health.startup]
path = "/api/healthz"
