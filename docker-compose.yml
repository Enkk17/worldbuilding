name: worldweave

services:
  db:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldweave}
      POSTGRES_USER: ${POSTGRES_USER:-worldweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example first}
    volumes:
      - worldweave_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-worldweave}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-worldweave}
    command: ["uv", "run", "--no-sync", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-worldweave}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-worldweave}
      ENVIRONMENT: production
      REGISTRATION_MODE: ${REGISTRATION_MODE:-bootstrap_only}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDIA_ROOT: ${MEDIA_ROOT:-/var/lib/worldweave/media}
      MAX_ASSET_BYTES: ${MAX_ASSET_BYTES:-10485760}
    volumes:
      - worldweave_media:${MEDIA_ROOT:-/var/lib/worldweave/media}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      WORLDWEAVE_DOMAIN: ${WORLDWEAVE_DOMAIN:-:80}
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HTTPS_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  worldweave_postgres:
  worldweave_media:
  caddy_data:
  caddy_config:
